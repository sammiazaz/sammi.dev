services:
  site:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    init: true
    environment:
      IS_ALLOY: ${IS_ALLOY:-true}
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    command: bash -lc "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  node_modules:
